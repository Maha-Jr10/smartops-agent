[project]
name = "smartops-agent"
version = "0.1.0"
description = "Agent intelligent : orchestration d'outils, observabilité et gouvernance (mini-projet MLOps, ENSAF ISDIA3)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Binôme ISDIA3" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "groq>=0.11",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tenacity>=8.5",
]

[project.optional-dependencies]
mlops = [
    "mlflow>=2.16",
    "dvc>=3.50",
    "evidently>=0.4.33",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "bandit[toml]>=1.7",
    "types-PyYAML>=6.0",
    "locust>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartops_agent"]

# Code quality

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["smartops_agent"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "evidently.*", "dvc.*", "groq.*", "pandas.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

# Tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: tests rapides, sans réseau ni LLM",
    "integration: composants assemblés, LLM simulé (mock)",
    "e2e: scénarios complets de bout en bout",
    "eval: évaluation sur le jeu de scénarios (LLM réel, coûteux)",
]

[tool.coverage.run]
source = ["smartops_agent"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
