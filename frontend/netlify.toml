[build]
  base    = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Rewrites: /api/* -> FastAPI backend on Railway/Render
# Set NEXT_PUBLIC_API_URL in Netlify > Site settings > Environment variables
# to your Railway/Render backend URL (e.g. https://smartops-api.up.railway.app)
