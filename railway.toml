[build]
builder      = "NIXPACKS"
buildCommand = "pip install uv && uv sync --frozen"

[deploy]
startCommand = "uv run uvicorn smartops_agent.api.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.variables]
# Set these in Railway > Variables tab (never commit real values)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# OPENAI_API_KEY   (or leave empty to use simulated LLM)
