[build]
builder      = "NIXPACKS"
buildCommand = "pip install uv && uv sync --frozen --extra mlops"

[deploy]
startCommand = "uv run uvicorn smartops_agent.api.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.variables]
MLFLOW_TRACKING_URI = "https://dagshub.com/Maha-Jr10/smartops-agent.mlflow"
MLFLOW_TRACKING_USERNAME = "Maha-Jr10"
# Set secrets and service-specific values in Railway > Variables. Never commit tokens.
# MLFLOW_TRACKING_PASSWORD
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# OPENAI_API_KEY   (or leave empty to use simulated LLM)
