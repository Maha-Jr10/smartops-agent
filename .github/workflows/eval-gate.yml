# Évaluation de l'agent sur le jeu de scénarios avec un vrai LLM, puis quality gates.
# Déclenchement manuel pour l'instant. En phase 2, ajouter le déclencheur pull_request vers main.
name: Eval gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Pipeline DVC (données, évaluation, gates)
        run: uv run dvc repro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/eval/
      - name: Résumé
        if: always()
        run: |
          echo "## Résultats d'évaluation" >> "$GITHUB_STEP_SUMMARY"
          cat reports/eval/metrics.json >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/eval/gates.json >> "$GITHUB_STEP_SUMMARY" || true
