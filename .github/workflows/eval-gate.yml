# Évaluation de l'agent sur le jeu de scénarios, puis quality gates.
# Déclenché sur chaque pull request vers main (avec LLM simulé si pas de clé).
name: Eval gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "data/scenarios/**"
      - "configs/**"
      - "params.yaml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Générer la base CRM fictive
        run: uv run python -m smartops_agent.data.seed params.yaml data/seed/crm.sqlite
      - name: Evaluation
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            uv run python -m smartops_agent.evaluation.run \
              --scenarios data/scenarios/scenarios_v1.jsonl \
              --db data/seed/crm.sqlite --model groq-large --repeats 3
          else
            echo "Pas de clé API — utilisation du LLM simulé"
            uv run python -m smartops_agent.evaluation.run \
              --scenarios data/scenarios/scenarios_v1.jsonl \
              --db data/seed/crm.sqlite --model groq-large --repeats 1 --stub
          fi
      - name: Quality gates
        run: uv run python -m smartops_agent.evaluation.gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/eval/
      - name: Résumé
        if: always()
        run: |
          echo "## Résultats d'évaluation" >> "$GITHUB_STEP_SUMMARY"
          cat reports/eval/metrics.json >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/eval/gates.json >> "$GITHUB_STEP_SUMMARY" || true
