# Canary proxy: ~10 % du trafic vers api-candidate, 90 % vers api stable.
# Le split est probabiliste (split_clients) : pas de sessions collantes.
split_clients "${request_id}" $upstream {
    10%  candidate;
    *    stable;
}

upstream stable    { server api:8000; }
upstream candidate { server api-candidate:8000; }

server {
    listen 80;

    location / {
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Deployment-Mode canary;
        proxy_read_timeout 35s;
    }
}
