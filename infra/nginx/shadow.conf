# Shadow proxy: forward all traffic to stable, mirror to shadow (fire and forget).
upstream stable  { server api:8000; }
upstream shadow  { server api-shadow:8000; }

server {
    listen 80;

    location / {
        # Mirror to shadow (non-blocking)
        mirror /mirror;
        mirror_request_body on;

        proxy_pass http://stable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }

    location = /mirror {
        internal;
        proxy_pass http://shadow$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Deployment-Mode shadow;
        proxy_read_timeout 35s;
    }
}
