# Shadow deployment overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.shadow.yml up -d
# The candidate API receives a copy of requests via the shadow proxy, but its
# responses are traced only (never served to end users).
services:
  api-shadow:
    image: ${CANDIDATE_IMAGE:-smartops-agent:candidate}
    environment:
      APP_ENV: shadow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SMARTOPS_CONFIG_DIR: /app/configs
    env_file:
      - path: .env
        required: false
    depends_on: [mlflow]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  shadow-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/shadow.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8001:80"]
    depends_on: [api, api-shadow]
